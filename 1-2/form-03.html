window.FORMATIVE = {
  subject: "통합과학2", unit: "Ⅰ-2 화학 변화", part: "03 반응과 에너지 출입",
  std: ["10통과2-01-05"], board: "board-03.html", sheet: "sheet-03.html", time: "10분",
  items: [

      opts: ["질산 암모늄을 물에 녹인다", "탄산수소 나트륨과 구연산을 물에 녹인다", "식물이 빛을 받아 광합성을 한다", "천연가스(메테인)가 연소한다"],
      a: 3, why: "메테인의 연소는 에너지를 방출하는 발열 반응입니다. 나머지는 주변의 에너지를 흡수합니다." },
    { lv: "기본", type: "short", ref: 5,
      q: "반응물이 가진 에너지보다 생성물이 가진 에너지가 더 커서, 반응이 일어나는 동안 주변의 에너지를 빨아들이는 반응을 무엇이라고 할까요?",
      a: ["흡열 반응", "흡열반응", "흡열"], why: "생성물의 에너지가 더 크려면 그 차이만큼 에너지를 주변에서 흡수해야 합니다. 그래서 주변 온도가 내려가는 흡열 반응입니다." },
    { lv: "기본", type: "mc", ref: 10,
      q: "냉찜질 팩을 발목에 댔더니 시원해졌습니다. 이때 일어나는 일로 옳은 것은?",
      opts: ["팩 속 물질이 만든 ‘냉기’가 발목으로 들어간다", "발목의 열이 팩 쪽으로 이동하고, 팩 속 변화가 그 열을 흡수한다", "팩 속의 에너지가 사라지면서 차가워진다", "팩이 열을 방출하고 발목이 그 열을 흡수한다"],
      a: 1, why: "‘냉기’라는 물질이나 에너지는 없습니다. 열은 온도가 높은 발목에서 낮은 팩으로 이동하고, 팩 속 흡열 과정이 그 열을 흡수합니다. 에너지는 사라지지 않고 옮겨 갈 뿐입니다." },
    { lv: "발전", type: "mc", ref: 5,
      q: "그림 (가)와 (나)는 두 반응의 에너지를 나타낸 것입니다. 손난로 속 반응과 냉찜질 팩 속 변화에 해당하는 그림을 바르게 짝지은 것은?",

        [[0, true], [320, false]].map(function (p) {
          var x = p[0], ex = p[1], s = "", rY = ex ? 70 : 160, pY = ex ? 160 : 70;

          return s;
        }).join("") + "<text x='620' y='226' font-size='12' fill='#8a94a6' text-anchor='end'>가로축 = 반응 진행</text></svg>",
      opts: ["손난로 (가), 냉찜질 팩 (나)", "손난로 (나), 냉찜질 팩 (가)", "손난로 (가), 냉찜질 팩 (가)", "손난로 (나), 냉찜질 팩 (나)"],
      a: 0, why: "손난로의 철 가루 산화는 반응물의 에너지가 더 커서 그 차이를 방출하는 발열 반응(가)입니다. 냉찜질 팩의 질산 암모늄 용해는 생성물의 에너지가 더 커서 주변의 에너지를 흡수합니다(나)." },
    { lv: "발전", type: "mc", ref: 8,
      q: "단원 화면의 손난로 모형에서 구멍 6단계, 철 가루 20 g으로 만들었더니 최고 온도는 약 54 ℃로 알맞았지만 50 ℃ 이상인 시간이 약 6시간뿐이었습니다. 세 조건(최고 60 ℃ 이하, 50 ℃ 이상 8시간 이상, 철 가루 30 g 이하)을 맞추려면 어떻게 바꿔야 할까요?",
      opts: ["공기 구멍을 8단계로 늘린다", "공기 구멍을 4단계로 줄인다", "구멍은 그대로 두고 철 가루를 28 g으로 늘린다", "구멍은 그대로 두고 철 가루를 40 g으로 늘린다"],
      a: 2, why: "구멍(산소가 들어오는 속도)은 최고 온도를, 철 가루의 양은 따뜻한 시간을 정합니다. 온도는 이미 알맞으니 철 가루만 늘립니다. 28 g이면 약 8.7시간입니다. 40 g은 30 g 조건을 넘고, 8단계는 60 ℃를 넘습니다." },
    { lv: "발전", type: "short", ref: 9, unit: "kJ",
      q: "질산 암모늄은 1몰(약 80 g)이 물에 녹을 때 약 26 kJ의 열을 흡수합니다. 질산 암모늄 40 g이 모두 녹으면 약 몇 kJ의 열을 흡수할까요?",
      a: ["13", "약13"], why: "40 g은 약 0.5몰이므로 26 kJ × 0.5 = 약 13 kJ을 흡수합니다." },
    { lv: "심화", type: "mc", ref: 11,
      q: "생물과 관련된 에너지 출입에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 광합성은 빛에너지를 흡수해야 일어난다.<br>ㄴ. 세포 호흡에서는 포도당이 산화되며 에너지를 방출한다.<br>ㄷ. 산과 염기의 중화 반응은 주변의 열을 흡수해 온도를 낮춘다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "광합성은 빛에너지를 흡수하고, 세포 호흡은 포도당을 산화시켜 에너지를 방출합니다. 중화 반응은 중화열을 내놓는 발열 반응이므로 ㄷ은 틀립니다." },
    { lv: "심화", type: "essay", ref: 9,
      q: "냉찜질 팩에 질산 암모늄을 너무 많이 넣으면 영하로 내려가 피부가 상할 수 있고, 너무 적게 넣으면 미지근합니다. 질산 암모늄의 양과 다 녹았을 때의 온도 사이의 관계를 ‘흡수한 열’이라는 말을 넣어 설명하고, 2~6 ℃를 맞추는 방법을 쓰세요.",
      model: "질산 암모늄이 물에 녹을 때 물의 열을 흡수하므로, 많이 넣을수록 흡수한 열이 많아 물의 온도가 더 많이 내려간다. 따라서 물의 양을 정해 두고 질산 암모늄의 양을 조금씩 바꾸어 다 녹았을 때 2~6 ℃가 되는 양을 찾는다(예: 20 ℃ 물 100 g에 약 25 g이면 약 4.6 ℃).",
      rubric: ["질산 암모늄이 녹을 때 열을 흡수한다고 썼다", "양이 많을수록 흡수한 열이 많아 온도가 더 내려간다고 설명했다", "물의 양을 정하고 질산 암모늄 양을 조절해 2~6 ℃를 맞춘다고 썼다"] }
  ]
};
