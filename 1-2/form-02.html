/* 형성평가 — 통합과학2 Ⅰ-2 02 산과 염기(지시약 · 중화 반응 · 중화점과 중화열 · 생활 속 중화). 값은 단원 화면과 칠판 강의 화면(board-02.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학2", unit: "Ⅰ-2 화학 변화", part: "02 산과 염기",
  std: ["10통과2-01-04"], board: "board-02.html", sheet: "sheet-02.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 4,
      q: "물에 녹았을 때 공통으로 수소 이온(H⁺)을 내놓는 물질끼리 짝지은 것은?",
      opts: ["염산(HCl), 아세트산(CH₃COOH)", "수산화 나트륨(NaOH), 암모니아(NH₃)", "에탄올(C₂H₅OH), 메테인(CH₄)", "수산화 칼슘(Ca(OH)₂), 에탄올(C₂H₅OH)"],
      a: 0, why: "염산과 아세트산은 물에 녹아 H⁺을 내놓는 산입니다. 수산화 나트륨·암모니아·수산화 칼슘은 OH⁻을 내놓는 염기이고, 에탄올과 메테인은 H를 가졌어도 H⁺을 내놓지 않습니다." },
    { lv: "기본", type: "mc", ref: 6,
      q: "에탄올(C₂H₅OH) 수용액에 대한 설명으로 옳은 것은?",
      opts: ["화학식에 OH가 있으므로 염기이다", "물에 녹아 OH⁻을 내놓는다", "전류가 흐르지 않고 BTB 용액의 색이 초록색 그대로이다", "페놀프탈레인 용액을 붉게 만든다"],
      a: 2, why: "에탄올의 OH는 탄소에 단단히 붙어 있어 OH⁻로 떨어져 나오지 않습니다. 이온이 없으니 전류가 흐르지 않고 지시약 색도 변하지 않습니다. 화학식의 글자가 아니라 물에 녹아 내놓는 이온으로 산·염기를 가릅니다." },
    { lv: "기본", type: "short", ref: 5,
      q: "어떤 수용액에 BTB 용액을 떨어뜨렸더니 노란색이 되었고, 마그네슘 조각을 넣었더니 기체가 발생했습니다. 이 수용액은 산성, 중성, 염기성 가운데 무엇일까요?",
      a: ["산성"], why: "BTB 용액은 산성에서 노란색입니다. 산의 H⁺이 마그네슘에게서 전자를 얻어 수소 기체가 됩니다." },
    { lv: "발전", type: "mc", ref: 9,
      q: "그래프는 20 ℃의 묽은 염산 20 mL에 20 ℃의 수산화 나트륨 수용액을 조금씩 넣으며 혼합 용액의 온도를 잰 결과입니다. 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      fig: "<svg viewBox='0 0 560 270' width='560' height='270' aria-label='넣은 수산화 나트륨 수용액 부피에 따른 온도: 16 mL에서 가장 높고 그 뒤로 내려간다'>" +
        "<g stroke='#dee2e6' stroke-width='1.5'><line x1='40' y1='44' x2='530' y2='44'/><line x1='40' y1='88' x2='530' y2='88'/><line x1='40' y1='132' x2='530' y2='132'/><line x1='40' y1='176' x2='530' y2='176'/></g>" +
        "<line x1='40' y1='220' x2='530' y2='220' stroke='#161b28' stroke-width='2.5'/><line x1='40' y1='30' x2='40' y2='220' stroke='#161b28' stroke-width='2.5'/>" +
        "<g font-size='14' font-weight='700' fill='#5f6b80' text-anchor='end'><text x='34' y='225'>20</text><text x='34' y='181'>22</text><text x='34' y='137'>24</text><text x='34' y='93'>26</text><text x='34' y='49'>28</text></g>" +
        "<g font-size='14' font-weight='700' fill='#161b28' text-anchor='middle'><text x='40' y='240'>0</text><text x='160' y='240'>8</text><text x='280' y='240'>16</text><text x='400' y='240'>24</text><text x='520' y='240'>32</text></g>" +
        "<text x='44' y='22' font-size='13' font-weight='800' fill='#5f6b80'>온도(℃)</text><text x='530' y='262' font-size='13' font-weight='800' fill='#5f6b80' text-anchor='end'>넣은 수산화 나트륨 수용액(mL)</text>" +
        "<polyline points='40,220 100,159 160,115 220,83 280,57 340,73 400,87 460,98 520,107' fill='none' stroke='#e03131' stroke-width='3'/>" +
        "<g fill='#e03131'><circle cx='40' cy='220' r='4.5'/><circle cx='100' cy='159' r='4.5'/><circle cx='160' cy='115' r='4.5'/><circle cx='220' cy='83' r='4.5'/><circle cx='280' cy='57' r='4.5'/><circle cx='340' cy='73' r='4.5'/><circle cx='400' cy='87' r='4.5'/><circle cx='460' cy='98' r='4.5'/><circle cx='520' cy='107' r='4.5'/></g></svg>",
      box: "ㄱ. 중화점은 수산화 나트륨 수용액을 16 mL 넣었을 때이다.<br>ㄴ. 24 mL 넣은 용액에 BTB 용액을 떨어뜨리면 파란색이 된다.<br>ㄷ. 16 mL를 넘어서도 물이 계속 생겨 열이 더 많이 나온다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "온도가 가장 높은 16 mL가 중화점입니다. 그 뒤로는 OH⁻이 남아 염기성(BTB 파란색)입니다. 중화점 뒤에는 더 반응할 H⁺이 없어 물이 더 생기지 않고, 식은 용액만 더해져 온도가 내려가므로 ㄷ은 틀립니다." },
    { lv: "발전", type: "short", ref: 8, unit: "mL",
      q: "단원 화면의 모형에서 묽은 염산 20 mL는 수산화 나트륨 수용액 16 mL에서 중화점에 이르렀습니다. 같은 묽은 염산 40 mL를 같은 수산화 나트륨 수용액으로 중화하려면 몇 mL가 필요할까요?",
      a: ["32"], why: "염산이 2배이면 H⁺도 2배이고, H⁺과 OH⁻은 1 : 1로 반응하므로 OH⁻도 2배인 32 mL가 필요합니다." },
    { lv: "발전", type: "mc", ref: 12,
      q: "다음 생활 속 문제 가운데 ‘산성 물질’을 써서 해결하는 것은?",
      opts: ["위산이 너무 많이 나와 속이 쓰리다", "산성화된 밭에서 작물이 잘 자라지 않는다", "생선을 손질한 도마에서 비린내가 난다", "벌레에 물린 자리가 산성 물질 때문에 따갑다"],
      a: 2, why: "생선 비린내의 원인 물질은 염기성이라 레몬즙이나 식초(산)로 중화합니다. 나머지는 원인이 산성이라 염기성 물질(제산제, 석회 가루, 묽은 암모니아수)을 씁니다." },
    { lv: "심화", type: "short", ref: 11, unit: "t",
      q: "pH 4.0인 호수 물 1,000 L(= 1 m³)를 정확히 중화하는 데 소석회 3.7 g이 필요했습니다. 같은 pH의 다른 호수에 물이 약 50만 m³ 있다면 소석회는 모두 약 몇 t 필요할까요? (1 t = 1,000,000 g)",
      a: ["1.85", "약1.85"], why: "3.7 g × 500,000 = 1,850,000 g = 1.85 t입니다. 없앨 H⁺의 수가 물의 양에 비례하므로 필요한 소석회도 비례합니다." },
    { lv: "심화", type: "essay", ref: 9,
      q: "묽은 염산에 수산화 나트륨 수용액을 넣다 보면 중화점을 지나 더 넣었을 때 혼합 용액의 온도가 오히려 내려갑니다. 그 까닭을 ‘H⁺’, ‘OH⁻’, ‘중화열’이라는 말을 넣어 설명하세요.",
      model: "중화열은 H⁺과 OH⁻이 1 : 1로 만나 물이 될 때 나온다. 중화점에서 H⁺이 모두 반응했으므로 그 뒤로 넣은 OH⁻은 반응할 H⁺이 없어 남기만 하고 열이 더 나오지 않는다. 처음 온도의 수산화 나트륨 수용액만 계속 더해지므로 혼합 용액의 온도가 내려간다.",
      rubric: ["중화열은 H⁺과 OH⁻이 만나 물이 될 때 나온다고 썼다", "중화점 뒤에는 반응할 H⁺이 없어 OH⁻이 남고 열이 더 나오지 않는다고 설명했다", "처음 온도의 용액이 더해져 전체 온도가 내려간다고 설명했다"] }
  ]
};
