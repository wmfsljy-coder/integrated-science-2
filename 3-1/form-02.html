window.FORMATIVE = {
  subject: "통합과학2", unit: "Ⅲ-1 과학 기술의 활용", part: "02 기술 발전과 빅데이터",
  std: ["10통과2-03-02"], board: "board-02.html", sheet: "sheet-02.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 4,
      q: "사회를 크게 바꾼 과학 기술을 등장한 시대 순서대로 바르게 늘어놓은 것은?",
      opts: ["전기의 활용 → 증기 기관 → 컴퓨터 → 인공지능 → 인터넷", "증기 기관 → 전기의 활용 → 컴퓨터 → 인터넷 → 인공지능", "증기 기관 → 컴퓨터 → 전기의 활용 → 인터넷 → 인공지능", "컴퓨터 → 증기 기관 → 전기의 활용 → 인공지능 → 인터넷"],
      a: 1, why: "18세기 증기 기관(산업 혁명) → 19세기 전기의 활용 → 20세기 중반 컴퓨터 → 20세기 말 인터넷 → 21세기 인공지능 순서입니다." },
    { lv: "기본", type: "short", ref: 10,
      q: "센서, 누리 소통망(SNS), 카드 결제, 위치 기록처럼 양이 너무 많고 빠르게 쌓이며 종류도 다양해서 예전 방식으로는 다룰 수 없는 데이터를 무엇이라고 할까요?",
      a: ["빅데이터", "빅 데이터", "big data", "bigdata"], why: "빅데이터는 크기·속도·다양성 때문에 예전 방식으로는 다루기 어려운 데이터입니다. 수집 → 저장·정리 → 분석 → 활용을 거쳐 쓸모 있는 정보가 됩니다." },
    { lv: "기본", type: "mc", ref: 11,
      q: "한 택배 회사가 지난 3년 동안의 배송 기록을 살펴, 요일과 날씨에 따라 물량이 늘어나는 규칙을 찾아냈습니다. 빅데이터 활용 단계 가운데 어디에 해당할까요?",
      opts: ["수집", "저장·정리", "분석", "활용"],
      a: 2, why: "쌓인 데이터에서 규칙과 패턴을 찾아내는 것은 분석 단계입니다. 이 규칙으로 인력과 차량을 미리 배치한다면 그때가 활용 단계입니다." },
    { lv: "발전", type: "mc", ref: 7,
      q: "보유층이 90%인 같은 명부에서 뽑는 여론 조사의 표본을 1,000명에서 240만 명으로 늘렸습니다. 이때 일어나는 일로 옳은 것은? (실제 지지율 60.8%, 이 명부로 예측하면 약 43%)",
      opts: ["표본이 커졌으므로 예측이 실제 60.8%에 가까워진다", "오차 범위는 크게 줄지만 예측은 여전히 약 43% 둘레에 머문다", "오차 범위와 편향이 함께 줄어든다", "표본이 커질수록 오차 범위도 커진다"],

    { lv: "발전", type: "short", ref: 6, unit: "%",

      a: ["46.4", "46.4%", "약46.4"], why: "0.8 × 40 + 0.2 × 72 = 32 + 14.4 = 46.4%입니다. 실제 지지율 60.8%보다 14.4%p 낮게 나오고, 루스벨트의 낙선을 예측하게 됩니다." },
    { lv: "발전", type: "mc", ref: 7,
      q: "고르게 뽑은 표본 1,000명으로 조사했더니 오차 범위가 약 ±3.0%p였습니다. 같은 방법으로 4,000명에게 물으면 오차 범위는 약 얼마가 될까요?",
      opts: ["약 ±0.75%p", "약 ±1.5%p", "약 ±3.0%p 그대로", "약 ±12%p"],
      a: 1, why: "오차 범위는 √n에 반비례합니다. 표본이 4배가 되면 √4 = 2이므로 오차 범위는 절반인 약 ±1.5%p가 됩니다. 4배 줄어드는 것이 아닙니다." },
    { lv: "심화", type: "mc", ref: 12,
      q: "가상 도시 주민 2,000명의 진료 기록(병명 포함)을 연구용으로 공개하려 합니다. 이름과 주민 번호는 지웠습니다. 다음 공개 방식 가운데 단 한 명으로 특정되는 사람이 가장 적은 것은?",
      opts: ["사는 동 · 생년월일 · 성별", "사는 동 · 출생 연도 · 성별", "사는 구 · 출생 연도 · 성별", "생년월일 · 성별"],
      a: 2, why: "단원 화면 모형에서 동·생년월일·성별은 99.7%, 동·출생 연도·성별은 44.9%, 생년월일·성별은 90.7%가 단 한 명으로 특정되지만, 구·출생 연도·성별은 0.15%(3명)뿐입니다. 정보를 덜 자세하게 공개하면 결합해도 개인이 무리 속에 숨습니다." },
    { lv: "심화", type: "essay", ref: 13,
      q: "한 음악 앱이 이용자들의 재생 기록을 분석해 ‘요즘 대한민국 10대가 가장 좋아하는 노래 순위’를 발표했습니다. 이 빅데이터 활용의 장점과 문제점을 하나씩 들고, 문제점을 줄일 방법을 제안하세요.",
      model: "장점: 설문보다 훨씬 많은 사람의 실제 행동 기록을 빠르게 모아 유행을 거의 실시간으로 알 수 있다. 문제점: 그 앱을 쓰는 10대만 기록되므로 다른 앱을 쓰거나 음악 앱을 쓰지 않는 10대의 취향은 빠져 편향이 생기고, 나이·위치 같은 재생 기록이 결합되면 개인이 드러날 수 있다. 방법: 여러 앱이나 고르게 뽑은 설문 결과와 비교해 편향을 확인하고, 개인을 알아볼 수 없도록 가명 처리해 묶음 단위로만 공개한다.",
      rubric: ["많은 데이터를 빠르게 모으는 등 구체적인 장점을 들었다", "특정 앱 이용자에게 치우친 편향 또는 개인 정보 문제를 문제점으로 들었다", "다른 자료와의 비교, 가명 처리 등 문제점을 줄일 구체적인 방법을 제안했다"] }
  ]
};
