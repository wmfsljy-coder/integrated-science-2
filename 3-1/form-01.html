<title>형성평가 · 감염병을 추적하라 (통합과학2 Ⅲ-1 01)</title>

<body>
<script>
/* 형성평가 — 통합과학2 Ⅲ-1 01 감염병을 추적하라(역학 조사 · PCR과 Ct 값 · 민감도·특이도·양성 예측도 · 감염 재생산 지수). 값은 단원 화면과 칠판 강의 화면(board-01.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학2", unit: "Ⅲ-1 과학 기술의 활용", part: "01 감염병을 추적하라",
  std: ["10통과2-03-01"], board: "board-01.html", sheet: "sheet-01.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 4,
      q: "1854년 런던 브로드가에 콜레라가 퍼졌을 때, 존 스노가 감염원을 찾아낸 방법으로 옳은 것은?",
      opts: ["현미경으로 펌프 물속의 콜레라균을 직접 관찰했다", "사망자가 나온 집을 지도에 표시해 사망자가 몰린 펌프를 찾았다", "거리마다 악취의 세기를 재어 가장 심한 곳을 찾았다", "환자와 몸이 닿은 사람을 모두 격리해 보았다"],
      a: 1, why: "스노는 병원체를 보지 못한 채, 사망자의 주소라는 데이터를 지도에 옮겨 브로드가 펌프를 찾아냈습니다. 콜레라균은 약 30년 뒤(1883년)에야 확인되었습니다. 이렇게 병이 어디서 어떻게 퍼지는지 데이터로 쫓는 것이 역학 조사입니다." },
    { lv: "기본", type: "short", ref: 7,
      q: "실시간 PCR에서 형광 신호가 검출 기준선을 처음 넘는 순간의 증폭 주기 수를 무엇이라고 할까요?",
      a: ["Ct 값", "Ct", "Ct값", "씨티 값", "씨티값"], why: "PCR은 주기마다 표적 유전자를 2배로 불리고, 신호가 기준선을 처음 넘는 주기 수를 Ct 값이라고 합니다. 처음 유전자가 많을수록 일찍 넘으므로 Ct 값이 작습니다." },
    { lv: "기본", type: "mc", ref: 8,
      q: "어떤 감염병 검사의 민감도가 80%라는 말의 뜻으로 옳은 것은?",
      opts: ["감염되지 않은 사람의 80%가 음성으로 나온다", "실제 감염자의 80%가 양성으로 나온다", "양성이 나온 사람의 80%가 실제 감염자이다", "검사받은 모든 사람의 80%를 정확히 판정한다"],
      a: 1, why: "민감도는 실제 감염자 가운데 양성으로 잡아내는 비율입니다. 비감염자를 음성으로 걸러 내는 비율은 특이도, 양성인 사람 가운데 실제 감염자의 비율은 양성 예측도로, 서로 다른 값입니다." },
    { lv: "발전", type: "short", ref: 9, unit: "%",
      q: "시민 1만 명 가운데 5%가 감염된 도시에서 민감도 80%, 특이도 98%인 신속항원검사를 모두에게 했습니다. 양성이 나온 사람 가운데 실제 감염자는 몇 %일까요? (소수 첫째 자리에서 반올림해 정수로)",
      a: ["68", "약68", "68%"], why: "감염자 500명 중 양성 400명, 비감염자 9,500명 중 위양성 2%인 190명입니다. 양성은 모두 590명이고 그 가운데 실제 감염자는 400 ÷ 590 ≈ 67.8%, 약 68%입니다. 유병률 1%일 때의 28.8%보다 높습니다." },
    { lv: "발전", type: "mc", ref: 7,
      q: "같은 장비와 시약으로 검사한 검체 A의 Ct 값은 21, 검체 B의 Ct 값은 31이었습니다. 이에 대한 설명으로 옳은 것은?",
      opts: ["A의 처음 유전자 양이 B보다 약 1,000배 많다", "B의 처음 유전자 양이 A보다 약 1,000배 많다", "A의 처음 유전자 양이 B보다 약 10배 많다", "Ct 값은 처음 유전자 양과 관계가 없다"],
      a: 0, why: "주기마다 2배가 되므로 10주기 일찍 기준선을 넘었다면 처음 양이 2¹⁰ = 1,024배, 약 1,000배 많은 것입니다. Ct 값이 클수록 많다고 거꾸로 생각하기 쉽습니다. 서로 다른 장비·시약의 Ct 값은 그대로 비교할 수 없습니다." },
    { lv: "발전", type: "mc", ref: 12,
      q: "그림은 인구 10만 명 도시에서 R₀ = 3인 감염병의 동시 환자 수를 세 가지 대책으로 계산한 것입니다. 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      fig: (function () {
        function sir(cut, vac) {
          var N = 100000, g = 1 / 7, b = 3 * g * (1 - cut / 100), dt = 0.25, S = N * (1 - vac / 100) - 10, I = 10, arr = [];
          for (var k = 0; k <= 240 * 4; k++) { if (k % 4 === 0) arr.push(I); var ni = b * S * I / N * dt, nr = g * I * dt; if (ni > S) ni = S; S -= ni; I += ni - nr; }
          return arr;
        }
        var X0 = 60, X1 = 400, Y0 = 16, Y1 = 196, s = "";
        function X(d) { return X0 + d / 240 * (X1 - X0); }
        function Y(v) { return Y1 - v / 32000 * (Y1 - Y0); }
        s += "<svg viewBox='0 0 420 240' width='420' height='240' aria-label='날짜에 따른 동시 환자 수 곡선 A, B, C와 의료 역량 5,000명 선. A가 가장 높고 이르며, C는 역량 선 아래에 있다'>";
        s += "<line x1='" + X0 + "' y1='" + Y(5000) + "' x2='" + X1 + "' y2='" + Y(5000) + "' stroke='#198a4a' stroke-width='2' stroke-dasharray='6 4'/><text x='" + X1 + "' y='" + (Y(5000) - 5) + "' font-size='12' fill='#198a4a' text-anchor='end'>의료 역량 5,000명</text>";
        s += "<line x1='" + X0 + "' y1='" + Y1 + "' x2='" + X1 + "' y2='" + Y1 + "' stroke='#161b28' stroke-width='2'/><line x1='" + X0 + "' y1='" + Y0 + "' x2='" + X0 + "' y2='" + Y1 + "' stroke='#161b28' stroke-width='2'/>";
        [[0, 0, "#e03131", "A 대책 없음"], [40, 0, "#f08c00", "B 접촉 −40%"], [40, 20, "#1462d8", "C 접촉 −40% + 접종 20%"]].forEach(function (c) {
          var a = sir(c[0], c[1]), p = [], d, mx = 0, md = 0;
          for (d = 0; d <= 240; d++) { p.push(X(d).toFixed(1) + " " + Y(a[d]).toFixed(1)); if (a[d] > mx) { mx = a[d]; md = d; } }
          s += "<polyline points='" + p.join(" ") + "' fill='none' stroke='" + c[2] + "' stroke-width='2.5'/>";
          s += "<text x='" + (X(md) + 6) + "' y='" + (Y(mx) - 5) + "' font-size='12' font-weight='700' fill='" + c[2] + "'>" + c[3] + "</text>";
        });
        [0, 60, 120, 180, 240].forEach(function (d) { s += "<text x='" + X(d) + "' y='" + (Y1 + 16) + "' font-size='12' text-anchor='middle'>" + d + "</text>"; });
        [0, 10000, 20000, 30000].forEach(function (v) { s += "<text x='" + (X0 - 6) + "' y='" + (Y(v) + 4) + "' font-size='12' text-anchor='end'>" + (v ? v / 10000 + "만" : "0") + "</text>"; });
        s += "<text x='" + X1 + "' y='" + (Y1 + 34) + "' font-size='12' text-anchor='end'>날짜(일)</text><text x='4' y='12' font-size='12'>동시 환자(명)</text></svg>";
        return s;
      })(),
      box: "ㄱ. B와 C는 A보다 정점이 낮고 늦게 온다.<br>ㄴ. C에서는 동시 환자가 의료 역량을 넘지 않는다.<br>ㄷ. C의 곡선이 의료 역량 아래에 있으므로 C에서 R은 1보다 작다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "대책은 정점을 낮추고 늦춥니다(A 약 30,464명·36일째, B 약 11,880명·77일째, C 약 4,212명·121일째). C의 R은 3 × 0.6 × 0.8 = 1.44로 아직 1보다 커서 유행은 계속됩니다. 곡선이 역량 아래로 내려온 것과 R이 1 미만인 것은 다른 일입니다." },
    { lv: "심화", type: "short", ref: 13, unit: "%",
      q: "기초 감염 재생산 지수 R₀ = 4인 감염병이 있습니다. 접촉은 전혀 줄이지 않고 백신만으로 R을 1보다 작게 만들려면, 접종률이 몇 %보다 높아야 할까요? (접종자는 모두 면역을 가진다고 가정)",
      a: ["75", "75%", "약75"], why: "R = 4 × (1 − 접종률) < 1 이어야 하므로 접종률 > 1 − 1/4 = 0.75, 곧 75%보다 높아야 합니다. 이렇게 면역을 가진 사람이 충분히 많아 유행이 꺼지는 상태가 집단 면역입니다. R₀가 클수록 필요한 접종률이 높아집니다." },
    { lv: "심화", type: "essay", ref: 9,
      q: "어느 도시에서 증상이 없는 시민 모두에게 신속항원검사(민감도 80%, 특이도 98%)를 했더니, 양성이 나온 사람 가운데 70% 이상이 실제로는 감염되지 않은 사람이었습니다. 검사가 정확하다고 알려졌는데도 이런 결과가 나온 까닭을 ‘유병률’과 ‘양성 예측도’를 써서 설명하고, 양성 결과를 믿을 만하게 만들 방법을 한 가지 제안하세요.",
      model: "증상이 없는 시민 전체는 유병률이 낮아(예: 1%) 비감염자가 대부분이다. 특이도가 98%여도 9,900명의 2%인 198명이 위양성으로 나와, 진짜 양성 80명보다 많아진다. 그래서 양성 예측도가 약 28.8%로 낮아진다. 양성이 나온 사람을 PCR로 다시 확인하거나, 증상자·접촉자처럼 유병률이 높은 집단을 골라 검사하면 결과를 더 믿을 수 있다.",
      rubric: ["유병률이 낮으면 비감염자가 많아 위양성 수가 진짜 양성보다 많아질 수 있음을 설명했다", "양성 예측도(양성인 사람이 진짜 감염자일 확률)가 낮아진다는 점을 숫자나 논리로 밝혔다", "PCR 확인 검사, 유병률이 높은 집단 검사 등 구체적인 방법을 제안했다"] }
  ]
};
</script>
