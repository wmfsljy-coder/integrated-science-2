<title>형성평가 · 생물다양성의 의미 (통합과학2 Ⅰ-1 03)</title>

<body>
<script>
/* 형성평가 — 통합과학2 Ⅰ-1 03 생물다양성의 의미(유전적 다양성 · 종 다양성 · 생태계 다양성 · 보전). 값은 단원 화면과 칠판 강의 화면(board-03.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학2", unit: "Ⅰ-1 지구 환경 변화와 생물다양성", part: "03 생물다양성의 의미",
  std: ["10통과2-01-02"], board: "board-03.html", sheet: "sheet-03.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 4,
      q: "1845년 아일랜드에서 감자 역병이 돌자 나라 전체의 감자밭이 한꺼번에 무너졌습니다. 가장 근본적인 까닭은?",
      opts: ["역병균이 다른 곳보다 유난히 독했기 때문이다",
             "밭 전체가 씨감자로 번식시킨 한 품종이어서 유전적으로 거의 같았기 때문이다",
             "감자가 역병을 겪으며 저항성을 기르는 데 시간이 걸렸기 때문이다",
             "감자가 다른 작물보다 수확량이 적었기 때문이다"],
      a: 1, why: "럼퍼 한 품종을 씨감자로 번식시켜 밭 전체가 복제 개체였습니다. 한 개체를 뚫은 병원균이 나머지도 모두 뚫었습니다. ③처럼 병을 겪는다고 저항성이 새로 생기지는 않습니다." },
    { lv: "기본", type: "short", ref: 7,
      q: "종 다양성을 따질 때 쓰는 두 기준 가운데, 한 지역에 사는 ‘종의 수’를 나타내는 것은 무엇일까요?",
      a: ["종 풍부도", "종풍부도", "풍부도"], why: "종의 수는 종 풍부도, 각 종이 얼마나 고르게 있는지는 종 균등도입니다. 종 다양성은 둘을 함께 따집니다." },
    { lv: "기본", type: "mc", ref: 10,
      q: "‘한 섬에 해안 사구, 소나무 숲, 민물 습지, 갯벌이 함께 있다’는 생물다양성의 어느 층위에 대한 설명일까요?",
      opts: ["유전적 다양성", "종 다양성", "생태계 다양성", "종 균등도"],
      a: 2, why: "생태계의 종류가 다양한 것은 생태계 다양성입니다. 생태계가 다양할수록 서로 다른 환경에 적응한 더 많은 종과 유전자가 깃듭니다." },
    { lv: "발전", type: "short", ref: 8,
      q: "어느 숲의 나무 100그루가 소나무 50그루, 참나무 30그루, 단풍나무 20그루입니다. 다양성 지수 D = 1 − (각 종 비율의 제곱의 합)은 얼마일까요? (소수 둘째 자리까지)",
      a: ["0.62"], why: "비율은 0.5, 0.3, 0.2입니다. 제곱의 합 = 0.25 + 0.09 + 0.04 = 0.38, D = 1 − 0.38 = 0.62입니다." },
    { lv: "발전", type: "mc", ref: 8,
      q: "(가) 숲은 네 종이 24 · 18 · 12 · 6그루, (나) 숲은 세 종이 20그루씩입니다. 옳은 설명만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 종 풍부도는 (가)가 (나)보다 크다.<br>ㄴ. (나)는 세 종의 비율이 같아 종 균등도가 가장 높은 상태이다.<br>ㄷ. 다양성 지수 D는 (나)가 (가)보다 크다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "(가)는 비율이 0.4 · 0.3 · 0.2 · 0.1이라 D = 1 − 0.30 = 0.70, (나)는 D = 1 − 3 × (1/3)² ≈ 0.67입니다. (나)가 완전히 고르지만 종 수가 적어 D는 (가)가 조금 큽니다. 종 다양성은 풍부도와 균등도를 함께 봐야 합니다." },
    { lv: "발전", type: "mc", ref: 9,
      q: "종이 적은 들판(풀 → 메뚜기 → 개구리 → 뱀 → 매)과 종이 많은 들판(뱀이 개구리와 들쥐를 먹는 등 먹이 관계가 그물처럼 얽힘)에서 똑같이 개구리를 없앴습니다. 먹이를 모두 잃은 동물은 사라진다고 할 때, 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 종이 적은 들판에서는 뱀과 매도 사라진다.<br>ㄴ. 종이 많은 들판에서 뱀이 살아남는 것은 다른 먹이가 있기 때문이다.<br>ㄷ. 종이 많을수록 한 종이 사라질 때 함께 사라지는 종도 많아진다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "한 줄 먹이 사슬에서는 개구리 → 뱀 → 매가 연달아 사라지지만, 먹이 그물이 복잡하면 다른 먹이로 버팁니다. 종 다양성이 높을수록 생태계 평형이 쉽게 깨지지 않으므로 ㄷ은 틀립니다." },
    { lv: "심화", type: "mc", ref: 12,
      q: "경상남도는 진해만 대구 자원을 되살리려고 2024년 수정란 35억 알과 어린 대구 1,400만 마리를 방류했습니다. 생물다양성의 관점에서 옳은 설명은?",
      opts: ["개체 수가 늘면 유전적 다양성도 반드시 같은 비율로 늘어난다",
             "같은 부모 무리에서 나온 수정란을 대량으로 풀면 개체 수는 늘어도 유전적 다양성은 크게 늘지 않을 수 있다",
             "산란장인 진해만이 망가져도 방류만 계속하면 대구는 지켜진다",
             "방류한 어린 대구는 바다에서 모두 서로 다른 종으로 바뀐다"],
      a: 1, why: "개체 수와 유전적 다양성은 다릅니다. 부모가 적으면 자손의 유전자도 비슷해 유전적 다양성이 크게 늘지 않을 수 있습니다. 산란장 같은 서식지(생태계)를 지키는 것도 함께 필요합니다." },
    { lv: "심화", type: "essay", ref: 5,
      q: "산불이 난 산을 되살리면서 가장 빨리 자라는 나무 한 품종만 모든 곳에 심으려 합니다. 생물다양성의 층위 가운데 두 가지 이상을 들어 이 계획의 문제점을 설명하고, 대안을 제안하세요.",
      model: "한 품종만 심으면 유전적 다양성이 낮아 병해충이나 기후 변화가 닥쳤을 때 숲 전체가 한꺼번에 피해를 입을 수 있다. 또 나무 종이 하나뿐이면 종 다양성이 낮아 먹이 그물이 단순해지고, 그 나무에 기대는 생물만 살게 되어 생태계 평형이 쉽게 깨진다. 여러 종과 여러 품종의 나무를 섞어 심고, 원래 그 지역에 살던 나무를 함께 심는 것이 좋다.",
      rubric: ["유전적 다양성이 낮아 병해충·환경 변화에 한꺼번에 피해를 입을 수 있음을 설명했다", "종 다양성(또는 생태계 다양성)이 낮아져 먹이 그물이 단순해지고 평형이 깨지기 쉽다고 설명했다", "여러 종·품종 섞어 심기 등 구체적인 대안을 제시했다"] }
  ]
};
</script>
