<script>
/* 형성평가 — 통합과학2 Ⅰ-1 01 지질시대와 대멸종(이리듐층 · 지질시대 · 표준 화석 · 다섯 번의 대멸종). 값은 단원 화면과 칠판 강의 화면(board-01.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학2", unit: "Ⅰ-1 지구 환경 변화와 생물다양성", part: "01 지질시대와 대멸종",
  std: ["10통과2-01-01"], board: "board-01.html", sheet: "sheet-01.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 8,
      q: "지구의 역사 46억 년을 1년 달력으로 줄였을 때, 가장 많은 날수를 차지하는 시대는?",
      opts: ["선캄브리아 시대", "고생대", "중생대", "신생대"],
      a: 0, why: "선캄브리아 시대가 1년 가운데 약 322일(약 88%)을 차지합니다. 고생대는 11월 19일에야 시작하고, 신생대는 약 5일뿐입니다." },
    { lv: "기본", type: "short", ref: 10,
      q: "어느 지층에서 삼엽충 화석이 나와, 이 지층이 고생대에 쌓였다고 판단했습니다. 이처럼 지층이 쌓인 시대를 알려 주는 화석을 무엇이라고 할까요?",
      a: ["표준 화석", "표준화석"], why: "특정 시대에만 살았던 생물의 화석이 나오면 그 지층이 쌓인 시대를 알 수 있습니다. 삼엽충(고생대), 암모나이트(중생대), 화폐석(신생대)이 대표적입니다." },
    { lv: "기본", type: "mc", ref: 9,
      q: "지질시대와 그 시대에 번성한 생물을 바르게 짝지은 것은?",
      opts: ["고생대 — 매머드, 속씨식물", "중생대 — 암모나이트, 겉씨식물", "신생대 — 삼엽충, 방추충", "고생대 — 공룡, 시조새"],
      a: 1, why: "중생대에는 암모나이트·공룡·겉씨식물이 번성했습니다. 매머드·속씨식물은 신생대, 삼엽충·방추충은 고생대, 공룡·시조새는 중생대입니다." },
    { lv: "발전", type: "mc", ref: 5,
      q: "그림은 이탈리아 구비오 절벽에서 높이를 바꿔 가며 잰 이리듐 농도입니다. 이 자료를 소행성 충돌의 증거로 해석하는 근거만을 〈보기〉에서 있는 대로 고른 것은?",
      fig: (function () {
        var X0 = 70, X1 = 380, Y0 = 20, Y1 = 200, s = "";
        function X(v) { return X0 + v / 10 * (X1 - X0); }
        function Y(z) { return Y0 + (40 - z) / 80 * (Y1 - Y0); }
        function ir(z) { return 0.3 + 8.7 * Math.exp(-Math.abs(z) / (z >= 0 ? 5 : 2)); }
        var p = [], z; for (z = -40; z <= 40; z += 0.5) p.push(X(ir(z)).toFixed(1) + " " + Y(z).toFixed(1));
        s += "<svg viewBox='0 0 420 250' width='420' height='250' aria-label='높이에 따른 이리듐 농도: 위아래 석회암은 약 0.3 ppb, 점토층(높이 0)에서 약 9 ppb'>";
        s += "<rect x='" + X0 + "' y='" + (Y(0) - 2) + "' width='" + (X1 - X0) + "' height='4' fill='#c92a2a' opacity='.6'/>";
        s += "<line x1='" + X0 + "' y1='" + Y1 + "' x2='" + X1 + "' y2='" + Y1 + "' stroke='#161b28' stroke-width='2'/><line x1='" + X0 + "' y1='" + Y0 + "' x2='" + X0 + "' y2='" + Y1 + "' stroke='#161b28' stroke-width='2'/>";
        s += "<polyline points='" + p.join(" ") + "' fill='none' stroke='#e03131' stroke-width='2.5'/>";
        [0, 5, 10].forEach(function (v) { s += "<text x='" + X(v) + "' y='" + (Y1 + 18) + "' font-size='13' text-anchor='middle'>" + v + "</text>"; });
        [40, 0, -40].forEach(function (z) { s += "<text x='" + (X0 - 8) + "' y='" + (Y(z) + 5) + "' font-size='13' text-anchor='end'>" + (z > 0 ? "+" + z : (z < 0 ? "−40" : "0")) + "</text>"; });
        s += "<text x='" + X1 + "' y='" + (Y1 + 40) + "' font-size='13' text-anchor='end'>이리듐 농도 (ppb)</text><text x='10' y='14' font-size='13'>높이 (cm)</text>";
        s += "<text x='" + (X1 - 4) + "' y='" + (Y(0) - 8) + "' font-size='13' fill='#c92a2a' text-anchor='end'>점토층 (약 1 cm)</text></svg>";
        return s;
      })(),
      box: "ㄱ. 이리듐은 지각에는 거의 없고 운석에는 훨씬 많다.<br>ㄴ. 점토층의 이리듐 농도가 위아래 석회암의 20~30배이다.<br>ㄷ. 이리듐이 많은 층일수록 우주 먼지가 오랜 세월 일정하게 쌓인 층이다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "지각에 드문 이리듐이 점토층에서만 바탕값(약 0.3 ppb)의 20~30배로 치솟았습니다. 늘 일정하게 떨어지는 우주 먼지만으로는 설명할 수 없는 양이어서, 연구팀은 큰 천체가 충돌해 한꺼번에 뿌려졌다고 해석했습니다. ㄷ은 연구팀이 처음 세웠다가 버린 가정입니다." },
    { lv: "발전", type: "mc", ref: 13,
      q: "대멸종과 그 주된 원인을 바르게 짝지은 것은?",
      opts: ["오르도비스기 말 — 소행성 충돌", "데본기 후기 — 판게아가 갈라지며 일어난 화산 활동", "페름기 말 — 시베리아의 대규모 화산 분출", "백악기 말 — 급격한 빙하기와 해수면 하강"],
      a: 2, why: "페름기 말 대멸종은 시베리아의 대규모 화산 분출로 온난화·해양 산성화·산소 부족이 겹쳐 종의 약 96%가 사라진 가장 큰 대멸종입니다. 오르도비스기 말은 빙하기, 데본기 후기는 바다의 산소 부족, 트라이아스기 말은 판게아 분리와 화산 활동, 백악기 말은 소행성 충돌입니다." },
    { lv: "발전", type: "short", ref: 8, unit: "일",
      q: "46억 년을 1년(365일) 달력으로 줄이면 하루는 약 1260만 년입니다. 중생대(약 2.52억 년 전 ~ 약 6600만 년 전)는 이 달력에서 약 며칠일까요? (소수 첫째 자리에서 반올림해 정수로)",
      a: ["15", "약15"], why: "중생대의 길이는 2억 5200만 − 6600만 = 1억 8600만 년입니다. 1억 8600만 ÷ 46억 × 365 ≈ 14.8일, 반올림하면 약 15일(12월 12일 ~ 12월 26일)입니다." },
    { lv: "심화", type: "mc", ref: 14,
      q: "백악기 말 대멸종이 생물다양성에 미친 영향에 대한 설명으로 옳은 것은?",
      opts: ["공룡이 사라진 뒤 생물다양성은 다시 늘어나지 않았다",
             "살아남은 생물이 비어 있는 환경으로 퍼져 나가 신생대에 다시 다양해졌다",
             "포유류는 공룡이 사라진 뒤 새로 생겨난 생물 무리이다",
             "소행성 충돌의 열과 충격만으로 모든 대륙의 생물이 즉시 사라졌다"],
      a: 1, why: "대멸종으로 다양성이 크게 줄었지만, 살아남은 작은 포유류와 조류가 빈 환경으로 퍼져 신생대에 번성했습니다. 포유류는 중생대에도 있었습니다. 멸종은 충돌 뒤 햇빛 차단 → 광합성 감소 → 먹이 사슬 붕괴로 이어졌습니다." },
    { lv: "심화", type: "essay", ref: 6,
      q: "‘약 6600만 년 전 소행성이 충돌했다’는 주장을 뒷받침하는 증거를 두 가지 이상 들고, 점토층의 이리듐이 왜 증거가 되는지 설명하세요.",
      model: "구비오 점토층에서 이리듐이 주변의 20~30배로 많이 나왔다. 이리듐은 지각에는 거의 없고 운석에 많으므로 지구 밖 천체에서 왔다고 볼 수 있다. 또 같은 시기의 이리듐층이 덴마크·뉴질랜드 등 세계 곳곳에서 발견되었고, 유카탄반도 땅속에서 지름 약 180 km의 칙술루브 충돌구와 충격 석영이 발견되었다.",
      rubric: ["이리듐이 지각에 드물고 운석에 많다는 점을 근거로 들었다", "세계 곳곳의 같은 시기 이리듐층을 들었다", "칙술루브 충돌구 또는 충격 석영·유리 알갱이를 들었다"] }
  ]
};
</script>
