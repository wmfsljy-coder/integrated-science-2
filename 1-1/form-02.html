window.FORMATIVE = {

      a: 0, why: "같은 종 안에서 개체마다 형질이 다른 것을 변이라고 합니다. 변이는 환경이 바뀌기 전부터 이미 있습니다." },
    { lv: "기본", type: "short", ref: 5,

      a: ["돌연변이"], why: "돌연변이로 새로운 유전자가 생기고, 유성 생식 과정에서 부모의 유전자가 다양하게 조합되어 변이가 나타납니다." },
    { lv: "기본", type: "mc", ref: 6,

    { lv: "심화", type: "essay", ref: 11,
      q: "갈라파고스 제도에는 한 조상에서 갈라져 나온 핀치가 10여 종 있고, 섬마다 먹이에 맞는 부리를 가지고 있습니다. 이렇게 여러 종이 생겨난 과정을 ‘변이’, ‘자연선택’, ‘유전’이라는 말을 넣어 설명하고, 생물다양성과 어떤 관계인지 쓰세요.",

      rubric: ["처음 집단 안에 변이가 있었음을 썼다", "섬(환경)마다 다른 형질이 자연선택되고 유전된다고 설명했다", "차이가 쌓여 다른 종이 되고 생물다양성이 늘어난다고 연결했다"] }
