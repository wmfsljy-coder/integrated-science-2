<script>
/* 형성평가 — 통합과학2 Ⅱ-2 02 발전 방식과 에너지원(전자기 유도 · 발전기 · 터빈 · 발전소의 영향). 값은 단원 화면과 칠판 강의 화면(board-02.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학2", unit: "Ⅱ-2 에너지 전환과 활용", part: "02 발전 방식과 에너지원",
  std: ["10통과2-02-05"], board: "board-02.html", sheet: "sheet-02.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 4,
      q: "검류계를 이은 코일과 막대자석으로 실험할 때, 검류계 바늘이 움직이지 <u>않는</u> 경우는?",
      opts: ["자석을 코일 속으로 빠르게 넣을 때",
             "자석을 코일에서 빠르게 뺄 때",
             "아주 센 자석을 코일 속에 넣은 채 가만히 둘 때",
             "자석은 두고 코일을 자석 쪽으로 움직일 때"],
      a: 2, why: "코일을 지나는 자기장이 변할 때만 유도 전류가 흐릅니다(전자기 유도). 자석이 아무리 세도 움직이지 않으면 자기장이 변하지 않아 바늘은 0입니다." },
    { lv: "기본", type: "short", ref: 6,
      q: "발전기는 자석 사이에서 코일을 돌려 (    ) 에너지를 전기 에너지로 바꾸는 장치입니다. 빈칸에 알맞은 말은?",
      a: ["운동", "운동 에너지", "운동에너지"], why: "터빈이나 손잡이가 축을 돌리는 운동 에너지가 전자기 유도로 전기 에너지가 됩니다." },
    { lv: "기본", type: "mc", ref: 9,
      q: "원자력 발전소에서 에너지가 전환되는 과정을 바르게 나타낸 것은?",
      opts: ["핵에너지 → 열에너지 → 터빈의 운동 에너지 → 전기 에너지",
             "핵에너지 → 전기 에너지",
             "화학 에너지 → 열에너지 → 터빈의 운동 에너지 → 전기 에너지",
             "핵에너지 → 빛에너지 → 전기 에너지"],
      a: 0, why: "원자로에서 우라늄이 핵분열할 때 나온 열로 물을 끓이고, 그 증기가 터빈과 발전기를 돌립니다. ③은 화력 발전, 빛을 곧바로 전기로 바꾸는 것은 태양광 발전입니다." },
    { lv: "발전", type: "mc", ref: 7,
      q: "단원 화면의 발전기 모형에서 코일 100회, 자석 0.20 T, 1초에 60회전일 때 전압은 약 110 V였습니다. 주파수를 60 Hz로 지키면서 약 220 V를 만드는 방법으로 알맞은 것은? (전압 ∝ 감은 수 × 자석 세기 × 회전 속도)",
      opts: ["코일은 그대로 두고 1초에 120회전으로 돌린다",
             "코일을 200회 감는다",
             "자석을 0.10 T로 바꾼다",
             "코일을 50회로 줄이고 1초에 240회전으로 돌린다"],
      a: 1, why: "1초 동안 회전수가 곧 주파수이므로 회전수는 60으로 묶여 있습니다(①, ④는 주파수가 바뀜). 감은 수를 두 배로 하면 전압도 두 배, 약 220 V가 됩니다. 자석을 0.40 T로 바꿔도 됩니다." },
    { lv: "발전", type: "mc", ref: 8,
      q: "발전 방식에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 지열 발전은 땅속 열로 만든 증기로 터빈을 돌린다.<br>ㄴ. 조력 발전은 바닷물을 끓여 만든 증기로 터빈을 돌린다.<br>ㄷ. 태양광 발전에는 터빈도 발전기도 없다.",
      opts: ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "조력 발전은 밀물과 썰물 때 흐르는 바닷물이 터빈을 직접 돌립니다. 끓이는 과정이 없으므로 ㄴ은 틀립니다." },
    { lv: "발전", type: "mc", ref: 11,
      q: "화력 발전은 전기 1 kWh를 만들 때 CO₂를 약 820 g 내보냅니다. 1년에 전기를 1,000만 kWh 쓰는 섬이 이 전기를 모두 화력으로 만들면 1년 동안 CO₂는 약 몇 톤 나올까요? (1톤 = 100만 g)",
      opts: ["약 82톤", "약 820톤", "약 8,200톤", "약 82,000톤"],
      a: 2, why: "820 g × 1,000만 = 82억 g = 8,200톤입니다. 같은 전기를 원자력(약 12 g/kWh)으로 만들면 약 120톤입니다." },
    { lv: "심화", type: "mc", ref: 12,
      q: "온실 기체에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 자연적인 온실 효과에 가장 크게 기여하는 기체는 수증기이다.<br>ㄴ. 사람이 내보낸 수증기는 대기에 오래 쌓여 지구 온난화의 주된 원인이 된다.<br>ㄷ. 이산화 탄소가 늘어 기온이 오르면 대기 중 수증기도 늘어 온난화를 더 키운다.",
      opts: ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "수증기는 온실 효과에 가장 크게 기여하지만, 그 양은 기온이 정하는 결과이고 사람이 내보낸 수증기는 며칠 안에 비로 내립니다(ㄴ 틀림). 사람이 늘리는 원인은 이산화 탄소이고, 수증기는 그 효과를 키웁니다." },
    { lv: "심화", type: "essay", ref: 13,
      q: "섬의 1년 전기를 만드는 데 화력 발전은 석탄 약 3,000톤, 원자력 발전은 우라늄-235 약 1.4 kg이 듭니다. 두 발전소의 공통점을 한 가지 쓰고, 각 발전소가 환경이나 생활에 남기는 문제를 한 가지씩 쓰세요.",
      model: "공통점: 둘 다 열원으로 물을 끓여 만든 증기로 터빈과 발전기를 돌린다(또는 날씨와 상관없이 많은 전기를 안정적으로 만든다, 온배수를 내보낸다). 화력 발전은 화석 연료를 태워 이산화 탄소와 미세 먼지 같은 대기 오염 물질을 내보낸다. 원자력 발전은 수만 년 넘게 보관해야 하는 방사성 폐기물이 생기고 사고가 나면 피해가 넓다.",
      rubric: ["물을 끓인 증기로 터빈을 돌린다는 공통점(또는 안정적 공급·온배수·연료 수입)을 썼다", "화력 발전의 문제(이산화 탄소·대기 오염)를 썼다", "원자력 발전의 문제(방사성 폐기물·사고 위험)를 썼다"] }
  ]
};
