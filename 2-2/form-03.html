<script>
/* 형성평가 — 통합과학2 Ⅱ-2 03 에너지 효율(효율 · 에너지 보존 · 전구 교체 · 신재생 에너지 · 지속가능한 발전). 값은 단원 화면과 칠판 강의 화면(board-03.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학2", unit: "Ⅱ-2 에너지 전환과 활용", part: "03 에너지 효율",
  std: ["10통과2-02-06"], board: "board-03.html", sheet: "sheet-03.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 4,
      q: "어떤 선풍기에 전기 에너지 200 J을 공급했더니 날개를 돌리는 운동 에너지가 150 J이었습니다. 이 선풍기의 에너지 효율은?",
      opts: ["25%", "50%", "75%", "150%"],
      a: 2, why: "효율 = 쓸모 있게 쓰인 에너지 ÷ 공급한 에너지 × 100 = 150 ÷ 200 × 100 = 75%입니다. 나머지 50 J은 주로 열과 소리로 흩어집니다." },
    { lv: "기본", type: "mc", ref: 7,
      q: "백열전구에 공급한 전기 에너지 가운데 빛이 되지 못한 에너지에 대한 설명으로 옳은 것은?",
      opts: ["전구 안에서 사라져 없어진다",
             "주로 열이 되어 주변으로 흩어진다",
             "전구 속에 쌓였다가 다음에 켤 때 쓰인다",
             "전선을 따라 발전소로 되돌아간다"],
      a: 1, why: "에너지는 없어지지 않습니다(에너지 보존). 빛이 되지 못한 에너지는 주로 열로 흩어져 다시 모아 쓰기 어려워질 뿐입니다." },
    { lv: "기본", type: "short", ref: 11,
      q: "연료 전지 같은 신에너지와 햇빛·바람·물처럼 다시 얻을 수 있는 재생 에너지를 함께 이르는 말은?",
      a: ["신재생 에너지", "신재생에너지"], why: "신재생 에너지는 고갈되지 않고 온실 기체를 거의 내지 않지만, 햇빛과 바람은 날씨에 따라 들쭉날쭉합니다." },
    { lv: "발전", type: "short", ref: 5, unit: "%",
      q: "발전소의 효율이 50%, 송전·배전 과정의 효율이 90%, LED 조명의 효율이 30%입니다. 연료의 에너지 가운데 빛이 되는 것은 몇 %일까요? (소수 첫째 자리까지)",
      a: ["13.5"], why: "단계마다 남는 비율을 곱합니다. 0.50 × 0.90 × 0.30 = 0.135 → 13.5%입니다. 효율을 더하거나 평균 내면 안 됩니다." },
    { lv: "발전", type: "mc", ref: 8,
      q: "효율이 40%(발전) → 96%(송전·배전) → 5%(백열전구)인 경로에서 전구만 바꿔 마지막 단계의 효율을 20%로 높이면, 석탄의 에너지 가운데 빛이 되는 비율은 약 얼마가 될까요?",
      opts: ["약 1.9%", "약 7.7%", "약 20%", "약 25%"],
      a: 1, why: "40% × 96% × 20% = 0.40 × 0.96 × 0.20 ≈ 0.077 → 약 7.7%, 지금(약 1.9%)의 4배입니다. 효율이 가장 낮은 단계를 고칠 때 효과가 가장 큽니다." },
    { lv: "발전", type: "mc", ref: 9,
      q: "같은 밝기(약 800 lm)를 내는 데 백열전구는 60 W, LED 전구는 9 W가 필요합니다. 하루 5시간씩 1년(365일) 켤 때 LED 전구로 바꾸면 줄어드는 전기 에너지는 약 얼마일까요?",
      opts: ["약 9 kWh", "약 51 kWh", "약 93 kWh", "약 110 kWh"],
      a: 2, why: "(60 − 9) W × 5 h × 365 = 93,075 Wh ≈ 93 kWh입니다. 백열전구는 1년에 약 110 kWh, LED 전구는 약 16 kWh를 씁니다." },
    { lv: "심화", type: "mc", ref: 12,
      q: "경유 발전기만 쓰던 섬마을이 태양광·풍력으로 전기를 만들려고 합니다. 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 햇빛과 바람은 날씨와 시간에 따라 발전량이 크게 달라진다.<br>ㄴ. 맑은 낮에 남는 전기를 배터리에 저장하면 밤에도 쓸 수 있다.<br>ㄷ. 태양광 설비를 충분히 늘리면 배터리 없이도 밤에 태양광으로 전기를 만들 수 있다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "밤에는 햇빛이 없으므로 설비를 아무리 늘려도 태양광은 발전하지 못합니다(ㄷ 틀림). 그래서 저장 장치(배터리)와 보조 전원을 함께 설계합니다." },
    { lv: "심화", type: "essay", ref: 6,
      q: "“에너지는 보존된다는데, 왜 에너지를 아껴 써야 하나요?”라는 친구의 질문에 ‘에너지 보존’, ‘열’, ‘효율’이라는 말을 넣어 답하세요.",
      model: "에너지는 형태가 바뀌어도 총량은 보존된다. 하지만 에너지를 쓸 때마다 일부가 열로 흩어지고, 흩어진 열은 다시 모아 쓰기 어렵다. 그래서 효율 100%인 기구는 없고 우리가 쓸 수 있는 에너지는 쓸수록 줄어든다. 또 전기를 만들려고 화석 연료를 태우면 자원이 고갈되고 온실 기체가 나오므로 아껴 써야 한다.",
      rubric: ["에너지의 총량은 보존된다는 것을 밝혔다", "쓸 때마다 열로 흩어져 다시 쓰기 어려워진다(효율 100%는 없다)고 설명했다", "쓸 수 있는 에너지가 줄어든다는 것(또는 자원 고갈·온실 기체)과 연결해 아껴야 하는 까닭을 썼다"] }
  ]
};
</script>
