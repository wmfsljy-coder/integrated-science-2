<script>
/* 형성평가 — 통합과학2 Ⅱ-2 01 태양 에너지의 생성과 전환(석탄 태양 · 수소 핵융합 · 질량 결손 · 지구의 에너지 흐름). 값은 단원 화면과 칠판 강의 화면(board-01.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학2", unit: "Ⅱ-2 에너지 전환과 활용", part: "01 태양 에너지의 생성과 전환",
  std: ["10통과2-02-04"], board: "board-01.html", sheet: "sheet-01.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 6,
      q: "태양 중심핵에서 에너지가 만들어지는 과정으로 옳은 것은?",
      opts: ["수소가 산소와 결합하여 타면서 빛과 열을 낸다",
             "수소 원자핵 4개가 합쳐져 헬륨 원자핵 1개가 되면서 에너지를 낸다",
             "헬륨 원자핵이 쪼개져 수소 원자핵이 되면서 에너지를 낸다",
             "거대한 석탄 덩어리가 천천히 타면서 에너지를 낸다"],
      a: 1, why: "태양 중심핵(약 1,500만 ℃)에서는 수소 원자핵 4개가 헬륨 원자핵 1개로 합쳐지는 수소 핵융합이 일어납니다. 산소와 결합하는 연소(①, ④)가 아닙니다." },
    { lv: "기본", type: "short", ref: 7,
      q: "핵융합 반응 뒤 원자핵들의 질량의 합이 반응 전보다 줄어듭니다. 이렇게 줄어든 질량을 무엇이라고 할까요?",
      a: ["질량 결손", "질량결손"], why: "줄어든 질량(Δm)은 E = Δm × c²만큼의 에너지로 바뀝니다. 수소 핵융합에서는 처음 질량의 약 0.7%가 줄어듭니다." },
    { lv: "기본", type: "mc", ref: 12,
      q: "지구에서 쓰는 에너지와 그 근원을 짝지은 것으로 옳지 <u>않은</u> 것은?",
      opts: ["풍력 — 태양이 지표를 고르지 않게 데워 생긴 대기의 운동",
             "수력 — 증발한 물이 높은 곳에 비로 내려 생긴 위치 에너지",
             "석유 — 옛 생물이 광합성으로 저장한 화학 에너지",
             "조력 — 햇빛에 데워진 바닷물이 움직이는 운동 에너지"],
      a: 3, why: "밀물과 썰물은 주로 달의 인력 때문에 생깁니다. 조력은 지열·핵에너지와 함께 근원이 태양이 아닌 에너지입니다." },
    { lv: "발전", type: "mc", ref: 4,
      q: "태양의 질량은 약 2.0×10³⁰ kg, 태양이 1초에 내보내는 에너지는 약 3.8×10²⁶ J, 석탄 1 kg이 탈 때 나오는 에너지는 약 3×10⁷ J입니다. 태양이 통째로 석탄이고 지금 밝기로 탄다면 다 타는 데 약 얼마가 걸릴까요? (1년 ≈ 3.2×10⁷ 초)",
      opts: ["약 50년", "약 5천 년", "약 500만 년", "약 46억 년"],
      a: 1, why: "2.0×10³⁰ × 3×10⁷ ÷ 3.8×10²⁶ ≈ 1.6×10¹¹ 초, 이를 3.2×10⁷ 초로 나누면 약 5천 년입니다. 지구의 나이 46억 년을 설명하지 못하므로 태양의 에너지원은 화학 반응이 아니라 원자핵 반응이어야 합니다." },
    { lv: "발전", type: "mc", ref: 7,
      q: "수소 원자핵 1개의 질량은 1.0073 u, 헬륨 원자핵 1개의 질량은 4.0015 u입니다. 수소 원자핵 4개가 헬륨 원자핵 1개로 바뀔 때 줄어드는 질량은 처음 질량의 약 몇 %일까요?",
      opts: ["약 0.07%", "약 0.7%", "약 7%", "약 27%"],
      a: 1, why: "4 × 1.0073 = 4.0292 u, 4.0292 − 4.0015 = 0.0277 u, 0.0277 ÷ 4.0292 ≈ 0.007 → 약 0.7%입니다. 이 작은 질량도 c²(9×10¹⁶)을 곱하면 아주 큰 에너지가 됩니다." },
    { lv: "발전", type: "mc", ref: 10,
      q: "지구에 온 태양 에너지를 100으로 놓을 때, 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 약 30은 구름과 지표에서 반사되어 우주로 돌아간다.<br>ㄴ. 지표가 흡수하는 양(약 50)이 대기가 흡수하는 양(약 20)보다 많다.<br>ㄷ. 흡수된 에너지가 지표를 고르지 않게 데워 바람과 해류를 일으킨다.<br>ㄹ. 지구는 태양이 내보내는 에너지의 절반쯤을 받는다.",
      opts: ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄹ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ, ㄹ"],
      a: 3, why: "반사 약 30, 대기 흡수 약 20, 지표 흡수 약 50이고, 흡수된 약 70이 열·운동·위치·화학 에너지로 전환됩니다. 지구가 받는 양은 태양이 내보내는 에너지의 약 22억분의 1뿐이므로 ㄹ은 틀립니다." },
    { lv: "심화", type: "short", ref: 13, unit: "J",
      q: "햇빛의 약 50%가 지표에 닿고, 식물은 받은 빛의 약 1%를 화학 에너지로 저장하며, 그중 0.1%가 화석 연료로 남는다고 가정합니다. 화석 연료 5 J이 만들어지려면 처음 햇빛은 약 몇 J이 필요할까요?",
      a: ["100만", "1000000", "1백만", "10^6", "1×10^6", "1x10^6", "1×10⁶"], why: "5 ÷ 0.001 = 5,000 J(식물) → ÷ 0.01 = 50만 J(지표의 빛) → ÷ 0.5 = 100만 J(햇빛)입니다. 화석 연료 1 J에 햇빛 약 20만 J이 들어 있으니 5 J이면 그 5배입니다." },
    { lv: "심화", type: "essay", ref: 8,
      q: "“태양은 타고 있다”는 말과 “태양은 가벼워지고 있다”는 말 가운데 무엇이 더 정확한지 고르고, ‘수소 핵융합’, ‘질량 결손’, ‘연소’라는 말을 넣어 그 까닭을 설명하세요.",
      model: "태양은 가벼워지고 있다는 말이 더 정확하다. 태양의 에너지는 연료가 산소와 결합하는 연소가 아니라 중심핵에서 수소 원자핵 4개가 헬륨 원자핵 1개로 합쳐지는 수소 핵융합에서 나온다. 이때 줄어든 질량(질량 결손)이 E = Δmc²만큼의 에너지로 바뀌므로, 태양은 1초에 약 420만 톤씩 질량이 줄어든다.",
      rubric: ["‘가벼워지고 있다’를 고르고 태양의 에너지가 연소가 아님을 밝혔다", "수소 원자핵이 헬륨 원자핵으로 합쳐지는 수소 핵융합을 설명했다", "질량 결손이 에너지로 바뀌어 태양의 질량이 줄어든다고 연결했다"] }
  ]
};
</script>
