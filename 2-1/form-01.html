<script>
/* 형성평가 — 통합과학2 Ⅱ-1 01 생태계의 구성(구성 요소 · 생산자·소비자·분해자 · 양엽과 음엽 · 작용·반작용·상호 작용). 값은 단원 화면과 칠판 강의 화면(board-01.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학2", unit: "Ⅱ-1 생태계와 환경 변화", part: "01 생태계의 구성",
  std: ["10통과2-02-01"], board: "board-01.html", sheet: "sheet-01.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 4,
      q: "학교 화단에서 찾은 것들입니다. 비생물적 요인만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 햇빛 &nbsp;&nbsp; ㄴ. 화단의 이끼 &nbsp;&nbsp; ㄷ. 흙 속 세균 &nbsp;&nbsp; ㄹ. 공기 &nbsp;&nbsp; ㅁ. 빗물",
      opts: ["ㄱ, ㄹ", "ㄱ, ㄷ, ㄹ", "ㄱ, ㄹ, ㅁ", "ㄴ, ㄷ, ㅁ", "ㄱ, ㄷ, ㄹ, ㅁ"],
      a: 2, why: "빛·공기·물은 살아 있지 않은 비생물적 요인입니다. 이끼는 생산자, 흙 속 세균은 분해자로 둘 다 생물적 요인입니다. 흙 자체와 흙 속에 사는 세균은 다릅니다." },
    { lv: "기본", type: "mc", ref: 5,
      q: "숲속 썩은 나무 둥치에 돋은 버섯에 대한 설명으로 옳은 것은?",
      opts: ["엽록체가 있어 광합성으로 양분을 만드는 생산자다",
             "죽은 생물을 분해해 양분을 얻는 분해자다",
             "살아 있는 동물을 먹는 소비자다",
             "나무에 붙어 있으므로 비생물적 요인이다"],
      a: 1, why: "버섯은 식물처럼 보이지만 광합성을 하지 못하는 균류입니다. 죽은 생물을 분해해 양분을 얻고 무기물을 흙으로 되돌리는 분해자입니다." },
    { lv: "기본", type: "short", ref: 10,
      q: "가을이 되어 낮의 길이가 짧아지자 국화가 꽃을 피웠습니다. 비생물적 요인이 생물에 영향을 준 이런 관계를 무엇이라고 할까요?",
      a: ["작용"], why: "빛(낮의 길이)이라는 환경이 생물에 영향을 주었으므로 작용입니다. 생물이 환경을 바꾸면 반작용, 생물끼리 영향을 주고받으면 상호 작용입니다." },
    { lv: "발전", type: "mc", ref: 8,
      q: "그림 (가)와 (나)는 같은 느티나무에서 딴 두 잎의 단면입니다. 이에 대한 설명으로 옳은 것은?",
      fig: "<svg viewBox='0 0 600 232' width='600' height='232' aria-label='(가)는 울타리 조직이 한 층인 얇은 잎, (나)는 울타리 조직이 세 층인 두꺼운 잎의 단면'>" +
        "<defs><pattern id='f1-p' width='20' height='34' patternUnits='userSpaceOnUse'><rect x='1.5' y='1.5' width='17' height='31' rx='6' fill='#d3f9d8' stroke='#2b8a3e' stroke-width='1.5'/></pattern>" +

          var x = p[0], n = p[1], W = 260, y = 34, s = "";

          s += "<rect x='" + x + "' y='" + (y + 10) + "' width='" + W + "' height='" + (34 * n) + "' fill='url(#f1-p)'/>";
          var sp = n === 1 ? 36 : 48;
          s += "<rect x='" + x + "' y='" + (y + 10 + 34 * n) + "' width='" + W + "' height='" + sp + "' fill='url(#f1-s)'/>";
          s += "<rect x='" + x + "' y='" + (y + 10 + 34 * n + sp) + "' width='" + W + "' height='10' fill='#e9ecef' stroke='#868e96'/>";
          return s;
        }).join("") +
        "<text x='600' y='228' font-size='12' fill='#8a94a6' text-anchor='end'>세포 수·크기를 단순화한 모식도</text></svg>",
      opts: ["(가)는 양엽이고, 나무 꼭대기의 햇빛이 강한 가지에 달려 있었다",
             "(나)는 양엽이고, 햇빛을 강하게 받는 가지에 달려 있었다",
             "(나)는 울타리 조직이 여러 층이라 빛이 약한 그늘에서 자랐다",
             "(가)와 (나)는 두께가 다르므로 서로 다른 종류의 나무에서 왔다"],
      a: 1, why: "(나)처럼 울타리 조직이 여러 층으로 쌓인 두꺼운 잎은 빛을 강하게 받는 곳의 양엽, (가)처럼 얇은 잎은 그늘의 음엽입니다. 한 나무에서도 둘 다 달립니다." },
    { lv: "발전", type: "mc", ref: 9,
      q: "양엽과 음엽에 대한 친구들의 말 가운데 옳은 것은?",
      opts: ["민지: 양엽은 양지 식물에만, 음엽은 음지 식물에만 생겨",
             "준호: 음엽은 빛을 적게 받으니 울타리 조직이 더 많이 쌓여 두꺼워",
             "서연: 한 그루에서도 바깥쪽 해 드는 가지엔 양엽, 안쪽 그늘엔 음엽이 달려",
             "도윤: 잎이 오래될수록 두꺼워져서 결국 모두 양엽이 돼"],
      a: 2, why: "양엽·음엽은 한 식물 안에서도 빛을 받는 정도에 따라 생깁니다. 울타리 조직이 여러 층인 쪽은 양엽입니다. 두께를 정하는 것은 잎의 나이가 아니라 빛입니다." },
    { lv: "발전", type: "mc", ref: 11,
      q: "반작용에 해당하는 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 나무가 우거진 숲은 빈터보다 한낮 기온이 낮다.<br>ㄴ. 낙엽이 분해되어 숲 바닥 흙에 양분이 많아진다.<br>ㄷ. 추운 곳에 사는 북극여우는 사막여우보다 귀가 작다.<br>ㄹ. 벌이 꿀을 얻으며 꽃의 꽃가루를 옮겨 준다.",
      opts: ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄹ", "ㄷ, ㄹ", "ㄱ, ㄴ, ㄹ"],
      a: 0, why: "ㄱ·ㄴ은 생물(숲, 낙엽)이 환경(기온, 토양)을 바꾼 반작용입니다. ㄷ은 온도(환경)가 생물에 영향을 준 작용, ㄹ은 생물끼리의 상호 작용입니다." },
    { lv: "심화", type: "mc", ref: 5,
      q: "어떤 숲에서 분해자만 모두 사라졌다고 가정할 때, 시간이 지나며 나타날 변화만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 낙엽과 죽은 생물이 분해되지 않고 쌓인다.<br>ㄴ. 흙으로 되돌아가는 무기물이 줄어 생산자가 잘 자라지 못한다.<br>ㄷ. 생산자가 광합성에 쓰는 햇빛이 줄어든다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "분해자가 없으면 죽은 생물이 쌓이고, 무기물이 흙으로 돌아가지 못해 생산자가 자라기 어렵습니다. 햇빛의 양은 분해자와 관계가 없으므로 ㄷ은 틀립니다." },
    { lv: "심화", type: "essay", ref: 12,
      q: "큰 나무 아래 그늘에서 자라던 어린 단풍나무를 햇빛이 잘 드는 빈터로 옮겨 심었습니다. 새로 나는 잎은 그늘에서 자란 잎과 어떻게 다를지 예상하고, 그 까닭을 ‘빛’, ‘울타리 조직’, ‘작용’이라는 말을 넣어 설명하세요.",
      model: "새로 나는 잎은 그늘에서 자란 잎보다 작고 두꺼운 양엽에 가까워진다. 빈터는 빛이 강해 울타리 조직이 여러 층으로 발달하기 때문이다. 빛이라는 비생물적 요인이 잎(생물)에 영향을 준 것이므로 작용에 해당한다.",
      rubric: ["새 잎이 더 작고 두꺼워질(양엽에 가까워질) 것이라고 예상했다", "강한 빛에서 울타리 조직이 여러 층으로 발달한다고 설명했다", "빛(환경)이 생물에 영향을 준 ‘작용’이라고 연결했다"] }
  ]
};
</script>
