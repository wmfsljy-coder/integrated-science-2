<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>형성평가 · 생태계 평형 (통합과학2 Ⅱ-1 02)</title>
<link rel="icon" href="https://wmfsljy-coder.github.io/science-teacher-hub-qtrqwc/assets/hub-icon.svg" type="image/svg+xml">
</head>
<body>
<script>
/* 형성평가 — 통합과학2 Ⅱ-1 02 생태계 평형(먹이 사슬·먹이 그물 · 생태 피라미드 · 평형과 영양 단계 연쇄 효과). 값은 단원 화면과 칠판 강의 화면(board-02.html)에 맞춘다. ref = 칠판 장면 번호 */
(function () {
  /* 단원 화면(episodes.js)의 세 종 모형 — 늑대 없는 70년 그래프용 */
  function simulate(V, E, Wf, years) {
    var r = 0.4, hG = 0.0267, K = 60, g = 0.3, p = 0.00275, q = 0.04, d = 0.1, s = 0.0005, dt = 0.05;
    var out = { t: [], V: [], E: [] }, n = Math.round(years / dt);
    for (var i = 0; i <= n; i++) {
      if (i % 10 === 0) { out.t.push(i * dt); out.V.push(V); out.E.push(E); }
      var dV = r * V * (1 - V / 100) - hG * V * E;
      var dE = g * E * (1 - E / Math.max(K * V / 100, 0.01)) - p * E * Wf;
      var dW = Wf * (q * E - d - s * Wf);
      V = Math.max(0.5, V + dV * dt); E = Math.max(0, E + dE * dt); Wf = Math.max(0, Wf + dW * dt);
    }
    return out;
  }
  var sim = simulate(75, 3.75, 0, 70), X0 = 60, X1 = 520, Y0 = 190, Y1 = 20;
  function X(t) { return (X0 + t / 70 * (X1 - X0)).toFixed(1); }
  function Y(f) { return (Y0 - f * (Y0 - Y1)).toFixed(1); }
  var fig = "<svg viewBox='0 0 600 230' width='600' height='230' aria-label='늑대가 사라진 1926년부터 70년 동안 엘크 수와 식생의 변화 모형 그래프'>";
  fig += "<line x1='" + X0 + "' y1='" + Y0 + "' x2='" + X1 + "' y2='" + Y0 + "' stroke='#161b28' stroke-width='2'/><line x1='" + X0 + "' y1='" + Y0 + "' x2='" + X0 + "' y2='" + Y1 + "' stroke='#161b28' stroke-width='2'/>";
  [0, 20, 40, 60].forEach(function (t) { fig += "<text x='" + X(t) + "' y='" + (Y0 + 18) + "' font-size='13' fill='#161b28' text-anchor='middle'>" + (1926 + t) + "</text>"; });
  fig += "<polyline points='" + sim.E.map(function (e, i) { return X(sim.t[i]) + " " + Y(e / 20); }).join(" ") + "' fill='none' stroke='#e8590c' stroke-width='3'/>";
  fig += "<polyline points='" + sim.V.map(function (v, i) { return X(sim.t[i]) + " " + Y(v / 100); }).join(" ") + "' fill='none' stroke='#2b8a3e' stroke-width='3' stroke-dasharray='8 5'/>";
  fig += "<text x='528' y='" + (+Y(sim.E[sim.E.length - 1] / 20) + 5) + "' font-size='14' font-weight='800' fill='#e8590c'>엘크</text>";
  fig += "<text x='528' y='" + (+Y(sim.V[sim.V.length - 1] / 100) + 5) + "' font-size='14' font-weight='800' fill='#2b8a3e'>식생</text>";
  fig += "<text x='" + X0 + "' y='12' font-size='12' fill='#5f6b80'>엘크(실선): 꼭대기 2만 마리 · 식생(점선): 꼭대기 100 % · 단순화한 모형</text></svg>";

window.FORMATIVE = {
  subject: "통합과학2", unit: "Ⅱ-1 생태계와 환경 변화", part: "02 생태계 평형",
  std: ["10통과2-02-02"], board: "board-02.html", sheet: "sheet-02.html", time: "10분",
  items: [
    { lv: "기본", type: "short", ref: 5,
      q: "한 생태계 안에서 여러 개의 먹이 사슬이 복잡하게 얽혀 그물처럼 연결된 것을 무엇이라고 할까요?",
      a: ["먹이 그물", "먹이그물"], why: "여러 먹이 사슬이 얽힌 것이 먹이 그물입니다. 먹이 그물이 복잡할수록 한 먹이가 줄어도 다른 먹이로 대신할 수 있어 생태계가 안정합니다." },
    { lv: "기본", type: "mc", ref: 6,
      q: "생태 피라미드에서 위 영양 단계로 갈수록 에너지양이 줄어드는 까닭으로 옳은 것은?",
      opts: ["위 단계의 생물일수록 먹이를 적게 먹기 때문이다",
             "각 단계의 생물이 얻은 에너지의 많은 부분을 생명 활동에 쓰고 열로 내보내기 때문이다",
             "위 단계로 갈수록 몸집이 작아지기 때문이다",
             "에너지가 위 단계에서 아래 단계로 거꾸로 전달되기 때문이다"],
      a: 1, why: "다음 단계로 전해지는 것은 약 10 %이고, 나머지는 호흡 같은 생명 활동에 쓰여 열로 빠져나가거나 먹히지 않고 남습니다." },
    { lv: "기본", type: "mc", ref: 10,
      q: "생태계가 평형을 이루고 있다는 말의 뜻으로 옳은 것은?",
      opts: ["모든 생물의 개체 수가 같아져 더 이상 변하지 않는다",
             "개체 수가 오르내리면서도 먹이 관계를 통해 전체적으로 균형이 유지된다",
             "포식자가 없어 피식자가 마음껏 늘 수 있다",
             "먹이 사슬이 한 줄로 단순해졌다"],
      a: 1, why: "평형은 멈춘 상태가 아닙니다. 한 종의 수가 늘거나 줄어도 먹고 먹히는 관계를 따라 다시 균형을 되찾는 상태입니다." },
    { lv: "발전", type: "short", ref: 6,
      q: "단계마다 에너지의 10 %가 다음 단계로 전달되는 먹이 사슬 ‘풀 → 엘크 → 늑대’가 있습니다. 늑대 무리에 에너지 3,000이 필요하다면, 생산자(풀)에는 에너지가 적어도 얼마 있어야 할까요?",
      a: ["300000", "300,000", "30만"], why: "늑대는 생산자 에너지의 10 % × 10 % = 1 %를 얻습니다. 3,000 ÷ 0.01 = 300,000입니다." },
    { lv: "발전", type: "mc", ref: 8,
      q: "그래프는 늑대가 사라진 1926년부터 70년 동안 엘크 수와 식생의 변화를 나타낸 모형입니다. 옳은 해석만을 〈보기〉에서 있는 대로 고른 것은?",
      fig: fig,
      box: "ㄱ. 처음에 엘크가 크게 늘어난 것은 포식자가 사라졌기 때문이다.<br>ㄴ. 엘크가 더 늘지 못하고 줄어든 것은 먹이인 식생이 줄었기 때문이다.<br>ㄷ. 70년 뒤에는 식생이 처음 수준으로 회복되었다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "포식자가 사라지자 엘크가 크게 늘었고, 먹이(식생)가 바닥나자 더 늘지 못했습니다. 식생은 75 %에서 20 %로 줄어 70년이 지나도 회복되지 않았으므로 ㄷ은 틀립니다." },
    { lv: "발전", type: "mc", ref: 11,
      q: "늑대를 옐로스톤에 다시 데려온 뒤 강가에 비버가 늘어난 까닭으로 가장 알맞은 것은?",
      opts: ["늑대가 비버를 다른 포식자로부터 지켜 주었기 때문이다",
             "늑대가 엘크를 줄여 버드나무가 다시 자라자 비버의 먹이와 둑 재료가 늘었기 때문이다",
             "비버가 늑대를 피해 강가로 모여들었기 때문이다",
             "늑대가 엘크 대신 버드나무를 먹었기 때문이다"],
      a: 1, why: "포식자의 영향이 엘크 → 버드나무 → 비버로 먹이 사슬을 타고 내려간 영양 단계 연쇄 효과입니다." },
    { lv: "심화", type: "mc", ref: 11,
      q: "바다에서는 ‘다시마 숲(켈프) → 성게 → 해달’의 먹이 관계가 있습니다. 이 바다에서 해달이 사냥으로 크게 줄어든다면 이어서 나타날 변화로 가장 알맞은 것은?",
      opts: ["성게가 줄고 다시마 숲이 넓어진다",
             "성게가 늘고 다시마 숲이 줄어든다",
             "성게와 다시마 숲이 모두 늘어난다",
             "성게와 다시마 숲 모두 변화가 없다"],
      a: 1, why: "포식자인 해달이 줄면 피식자인 성게가 늘고, 성게가 다시마를 뜯어 먹어 숲이 줄어듭니다. 늑대가 사라진 옐로스톤과 같은 구조입니다." },
    { lv: "심화", type: "essay", ref: 8,
      q: "늑대가 한 마리도 없던 70년 동안 옐로스톤의 강가 숲이 스스로 회복되지 못한 까닭을 ‘먹이 사슬’, ‘엘크’, ‘식생’이라는 말을 넣어 설명하세요.",
      model: "먹이 사슬의 맨 위 포식자인 늑대가 사라지자 엘크의 수를 조절하던 고리가 끊겼다. 엘크가 크게 늘어 어린 나무를 계속 뜯어 먹었고, 식생은 줄어든 채로 엘크가 계속 많아 다시 자랄 틈이 없었다. 그래서 숲은 망가진 상태로 굳어져 원래 균형으로 돌아오지 못했다.",
      rubric: ["늑대가 사라져 먹이 사슬의 고리가 끊겼다(엘크 수를 조절하지 못한다)고 설명했다", "엘크가 늘어 식생(어린 나무)을 뜯어 먹었다고 연결했다", "엘크가 많이 남아 있어 식생이 다시 자라지 못하고 망가진 채 굳어졌다고 설명했다"] }
  ]
};
})();
</script>
