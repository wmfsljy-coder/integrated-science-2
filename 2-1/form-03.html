<script>
/* 형성평가 — 통합과학2 Ⅱ-1 03 지구 환경 변화(온실 효과 · 엘니뇨 · 사막화 · 대처). 값은 단원 화면과 칠판 강의 화면(board-03.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "통합과학2", unit: "Ⅱ-1 생태계와 환경 변화", part: "03 지구 환경 변화 (엘니뇨)",
  std: ["10통과2-02-03"], board: "board-03.html", sheet: "sheet-03.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 5,
      q: "온실 효과에 대한 설명으로 옳은 것은?",
      opts: ["사람이 내보낸 온실 기체 때문에만 생기는 현상이다",
             "대기가 지표의 적외선을 흡수했다가 지표로 재복사해 지표를 따뜻하게 한다",
             "대기가 햇빛(가시광선)을 대부분 막아서 지표를 따뜻하게 한다",
             "온실 효과가 없으면 지구 평균 기온이 지금보다 높아진다"],
      a: 1, why: "온실 효과는 자연 현상입니다. 지표가 내보낸 적외선을 수증기·이산화 탄소가 흡수했다가 지표로 다시 내보내(재복사) 지표가 따뜻해집니다. 가시광선은 대부분 통과합니다." },
    { lv: "기본", type: "short", ref: 6, unit: "℃",
      q: "단원 화면의 모형에서 온실 효과가 전혀 없다면(흡수율 0%) 지구의 평균 기온은 약 몇 ℃일까요?",
      a: ["−18", "-18", "영하18"], why: "흡수율 0%이면 약 −18 ℃입니다. 지금은 자연적인 온실 효과 덕분에 약 15 ℃입니다." },
    { lv: "기본", type: "mc", ref: 9,
      q: "엘니뇨에 대한 설명으로 옳은 것은?",
      opts: ["적도 부근 동태평양의 표층 수온이 평소보다 높아지는 현상",
             "적도 부근 동태평양의 표층 수온이 평소보다 낮아지는 현상",
             "사막 주변의 땅이 점점 사막처럼 바뀌는 현상",
             "빙하가 녹아 해수면이 높아지는 현상"],
      a: 0, why: "무역풍이 약해져 따뜻한 물이 동쪽으로 퍼지면서 동태평양 수온이 높아지는 현상이 엘니뇨입니다. ②는 반대 상태인 라니냐, ③은 사막화, ④는 해수면 상승입니다." },
    { lv: "기본", type: "short", ref: 9,
      q: "평년에 페루 앞바다에서 차가운 심층의 바닷물이 표층으로 솟아오르는 현상을 무엇이라고 할까요?",
      a: ["용승"], why: "무역풍이 표층의 물을 서쪽으로 밀어 낸 빈자리를 아래의 찬물이 채웁니다. 영양염이 많아 좋은 어장이 됩니다." },
    { lv: "발전", type: "mc", ref: 9,
      q: "그림은 적도 태평양을 동서로 자른 단면입니다. 엘니뇨 시기의 모습과 그때 무역풍의 상태를 바르게 짝지은 것은?",
      fig: "<svg viewBox='0 0 660 268' width='660' height='268' aria-label='적도 태평양 단면 (가)와 (나): (가)는 따뜻한 물이 동쪽 끝까지 고르게 퍼져 있고, (나)는 따뜻한 물이 서쪽에 두껍게 쌓여 있다'>" +
        "<defs><marker id='f3-up' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='4' markerHeight='4' orient='auto'><path d='M0 0 L10 5 L0 10 Z' fill='#e7f5ff'/></marker></defs>" +
        [[0, true], [350, false]].map(function (p) {
          var x = p[0], el = p[1], W = 310, s = "";
          s += "<text x='" + (x + W / 2) + "' y='22' font-size='20' font-weight='900' fill='#161b28' text-anchor='middle'>" + (el ? "(가)" : "(나)") + "</text>";
          s += "<rect x='" + x + "' y='34' width='" + W + "' height='56' fill='#e7f5ff'/><rect x='" + x + "' y='90' width='" + W + "' height='130' fill='#1c7ed6'/>";
          s += el ? "<path d='M" + x + " 90 H" + (x + W) + " V116 Q" + (x + W / 2) + " 120 " + x + " 122 Z' fill='#ff922b'/>"
                  : "<path d='M" + x + " 90 H" + (x + W) + " V96 Q" + (x + W / 2) + " 128 " + x + " 150 Z' fill='#ff922b'/>";
          s += "<rect x='" + x + "' y='70' width='40' height='150' fill='#c49a6c'/><rect x='" + (x + W - 36) + "' y='70' width='36' height='150' fill='#c49a6c'/>";
          s += "<path d='M" + (x + W - 60) + " 210 Q" + (x + W - 52) + " 160 " + (x + W - 50) + " " + (el ? 140 : 100) + "' stroke='#e7f5ff' stroke-width='" + (el ? 2.5 : 5) + "' fill='none'" + (el ? " stroke-dasharray='6 5'" : "") + " marker-end='url(#f3-up)'/>";
          s += "<text x='" + (x + 20) + "' y='242' font-size='15' font-weight='800' fill='#5f6b80' text-anchor='middle'>서</text><text x='" + (x + W - 18) + "' y='242' font-size='15' font-weight='800' fill='#5f6b80' text-anchor='middle'>동</text>";
          return s;
        }).join("") +
        "<text x='660' y='265' font-size='12' fill='#8a94a6' text-anchor='end'>주황 = 따뜻한 표층수 · 깊이 과장</text></svg>",
      opts: ["(가), 무역풍이 강해진다", "(가), 무역풍이 약해진다", "(나), 무역풍이 강해진다", "(나), 무역풍이 약해진다"],
      a: 1, why: "(가)는 따뜻한 물이 동쪽 끝까지 고르게 퍼지고 동쪽의 용승이 약합니다. 무역풍이 약해진 엘니뇨 시기입니다. (나)는 따뜻한 물이 서쪽에 두껍게 쌓인 평년입니다." },
    { lv: "발전", type: "mc", ref: 10,
      q: "엘니뇨 시기에 나타나는 현상만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 인도네시아·호주에 가뭄과 산불이 늘어난다.<br>ㄴ. 페루 연안의 어획량이 줄어든다.<br>ㄷ. 페루 연안의 용승이 강해진다.<br>ㄹ. 평소 건조한 동태평양 연안에 비가 많이 내린다.",
      opts: ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄹ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ, ㄹ"],
      a: 3, why: "비구름이 동쪽으로 옮겨 가 서쪽은 가뭄, 동쪽은 폭우가 됩니다. 용승은 약해지므로 ㄷ은 틀립니다." },
    { lv: "발전", type: "mc", ref: 13,
      q: "기후 변화에 대처하는 방안 가운데 ‘적응’에 해당하는 것은?",
      opts: ["태양광·풍력 발전의 비중을 늘린다", "대중교통을 이용한다", "숲을 가꾸어 이산화 탄소 흡수원을 넓힌다", "해수면 상승에 대비해 해안 방조제를 높인다"],
      a: 3, why: "①~③은 온실 기체를 줄이거나 흡수하는 완화, ④는 이미 닥친 변화에 대비하는 적응입니다." },
    { lv: "발전", type: "mc", ref: 12,
      q: "단원 화면의 모형에서 기온 상승 ≈ 1.3 ℃ + 0.45 ℃ × (2024년 이후 누적 배출량 ÷ 1,000 Gt)입니다. 앞으로 이산화 탄소를 1,000 Gt 더 내보내면 기온 상승은 약 몇 ℃일까요?",
      opts: ["약 1.3 ℃", "약 1.75 ℃", "약 2.0 ℃", "약 2.3 ℃"],
      a: 1, why: "1.3 + 0.45 × 1 = 1.75 ℃입니다. 2 ℃를 넘지 않으려면 앞으로의 누적 배출량을 약 1,560 Gt 아래로 묶어야 합니다." },
    { lv: "심화", type: "mc", ref: 6,
      q: "대기가 지구 복사(적외선)를 흡수하는 비율이 높아질 때 일어나는 변화만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 대기가 지표로 보내는 재복사가 늘어난다.<br>ㄴ. 지표의 평균 기온이 올라간다.<br>ㄷ. 대기를 통과해 지표에 닿는 가시광선이 크게 줄어든다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "흡수율이 높아지면 재복사가 늘어 지표 기온이 오릅니다(온실 효과의 강화). 대기는 가시광선을 대부분 통과시키므로 ㄷ은 틀립니다." },
    { lv: "심화", type: "essay", ref: 10,
      q: "엘니뇨가 일어나면 페루 연안의 멸치 어획량이 크게 줄어듭니다. 그 까닭을 ‘무역풍’, ‘용승’, ‘영양염’이라는 말을 넣어 설명하세요.",
      model: "무역풍이 약해지면 표층의 따뜻한 물이 동쪽으로 퍼져 페루 연안의 용승이 약해진다. 그러면 깊은 곳의 영양염이 표층으로 올라오지 못해 플랑크톤이 줄고, 이를 먹는 멸치도 줄어든다.",
      rubric: ["무역풍이 약해진다는 것을 들었다", "그 결과 페루 연안의 용승이 약해진다고 연결했다", "영양염이 줄어 먹이(플랑크톤)와 멸치가 줄어든다고 설명했다"] }
  ]
};
</script>
